name: WinUI source product

on:
  push:
    branches:
      - main
      - fix/ink-unprocessedinput-pointer-snapshots
      - fix/ink-pointer-snapshots-2.6.6-experimental
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winui-source-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: WinUI product (${{ matrix.flavor }})
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        flavor: [x64chk, x64fre]
    env:
      WINUI_FLAVOR: ${{ matrix.flavor }}
      NUGET_PACKAGES: ${{ github.workspace }}\packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      VisualStudioVersion: '18.0'
      NuGetAudit: 'false'
      CL: '/MP2'
    # Release tags (winui3/release/*) keep the product sources under src/.
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          show-progress: false

      - name: Prepare runner disk
        shell: pwsh
        run: ..\.github\scripts\prepare-winui-runner.ps1

      - name: Initialize and build product
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flavor = $env:WINUI_FLAVOR
          if ($flavor -eq 'x64fre') {
            .\init.ps1 $flavor /nopgo /notitle
          } else {
            .\init.ps1 $flavor /notitle
          }
          if ($LASTEXITCODE -ne 0) { throw "WinUI initialization failed with exit code $LASTEXITCODE" }

          $env:VisualStudioVersion = '18.0'
          $env:NuGetAudit = 'false'
          if ($flavor -eq 'x64fre') {
            $env:PGOBuildMode = 'Off'
            .\build.cmd product /restore /q
          } else {
            .\initrun.ps1 -Flavor $flavor .\build.cmd product /restore /q
          }
          if ($LASTEXITCODE -ne 0) { throw "WinUI product build failed with exit code $LASTEXITCODE" }

      - name: Verify and describe product payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configuration = if ($env:WINUI_FLAVOR -eq 'x64fre') { 'Release' } else { 'Debug' }
          $payload = "BuildOutput\packaging\$configuration\runtimes\win10-x64\native"
          if (-not (Test-Path -LiteralPath $payload)) { throw "Missing product payload: $payload" }
          $packages = @(Get-ChildItem -Path 'PackageStore' -Filter 'Microsoft.WindowsAppSDK.WinUI.*.nupkg' -File)
          if ($packages.Count -ne 1) { throw "Expected one WinUI package in PackageStore, found $($packages.Count)" }
          $package = $packages[0].FullName

          $fileCount = (Get-ChildItem -LiteralPath $payload -File -Recurse).Count
          if ($fileCount -eq 0) { throw 'The product payload is empty.' }
          $info = [ordered]@{
            commit = $env:GITHUB_SHA
            visualStudio = '2026'
            visualStudioVersion = '18.0'
            flavor = $env:WINUI_FLAVOR
            configuration = $configuration
            payload = $payload
            payloadFileCount = $fileCount
            package = $package
          }
          $info | ConvertTo-Json | Set-Content -LiteralPath 'BuildOutput\winui-build-info.json' -Encoding utf8
          Write-Host "Verified $fileCount runtime files."

      - name: Upload WinUI product artifacts
        uses: actions/upload-artifact@v6
        with:
          name: winui-product-${{ matrix.flavor }}-${{ github.sha }}
          path: |
            src/BuildOutput/packaging/${{ matrix.flavor == 'x64fre' && 'Release' || 'Debug' }}/runtimes/win10-x64/native/**
            src/PackageStore/Microsoft.WindowsAppSDK.WinUI.*.nupkg
            src/BuildOutput/winui-build-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: winui-build-logs-${{ matrix.flavor }}-${{ github.sha }}
          path: |
            src/BuildOutput/**/*.binlog
            src/BuildOutput/**/*.log
          if-no-files-found: ignore
          retention-days: 7
